name: Deployment Workflow

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
        # - staging

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  build:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_ORIGIN=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.CICD_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            deployment_log="${{ secrets.DEPLOYMENT_DIRECTORY }}/deployment.log"
            app_directory="${{ secrets.DEPLOYMENT_DIRECTORY }}/${{ github.event.repository.name }}"
            application_url="https://${{ secrets.DOMAIN_NAME }}"
            current_sha="${{ github.sha }}"
            previous_sha_file="${app_directory}/.previous_sha"
            latest_sha_file="${app_directory}/.latest_sha"
            backend_image="${{ env.BACKEND_IMAGE }}"
            frontend_image="${{ env.FRONTEND_IMAGE }}"

            log() {
              echo "${1}"
              echo "$(TZ='America/Chicago' date) | ${1}" >> "${deployment_log}"
            }

            validate_secrets() {
              log "Validating required secrets..."

              if [ -z "${{ secrets.DEPLOYMENT_DIRECTORY }}" ]; then
                log "✗ DEPLOYMENT_DIRECTORY secret is missing"
                exit 1
              fi

              if [ -z "${{ secrets.DOMAIN_NAME }}" ]; then
                log "✗ DOMAIN_NAME secret is missing"
                exit 1
              fi

              if [ -z "${{ secrets.GMAIL_EMAIL }}" ]; then
                log "✗ GMAIL_EMAIL secret is missing"
                exit 1
              fi

              if [ -z "${{ secrets.GMAIL_APP_PASSWORD }}" ]; then
                log "✗ GMAIL_APP_PASSWORD secret is missing"
                exit 1
              fi

              if [ -z "${{ secrets.RECIPIENT_EMAIL }}" ]; then
                log "✗ RECIPIENT_EMAIL secret is missing"
                exit 1
              fi

              if [ -z "${{ secrets.TMDB_API_KEY }}" ]; then
                log "✗ TMDB_API_KEY secret is missing"
                exit 1
              fi

              log "✓ All required secrets validated"
            }

            site_health_check() {
              local max_attempts=3
              local attempt=1

              while [ $attempt -le $max_attempts ]; do
                status_code=$(curl -o /dev/null -s -w "%{http_code}\n" "${application_url}")
                if [ "${status_code}" -eq 200 ]; then
                  log "✓ Site health check passed with status code ${status_code}"
                  return 0
                fi

                log "Site health check attempt ${attempt}/${max_attempts} failed with status code ${status_code}"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 15
                fi
                ((attempt++))
              done

              log "✗ Site health check failed after ${max_attempts} attempts"
              return 1
            }

            container_health_check() {
              local max_attempts=3
              local attempt=1

              while [ $attempt -le $max_attempts ]; do
                expected_services=("backend" "frontend" "mongo")
                all_running=true

                for service in "${expected_services[@]}"; do
                  if docker compose ps --services --filter "status=running" | grep -q "^${service}$"; then
                    log "✓ ${service} container is running"
                  else
                    log "✗ ${service} container is not running"
                    all_running=false
                    break
                  fi
                done

                if [ "$all_running" = true ]; then
                  log "All containers are running - health check passed"
                  return 0
                fi

                log "Container health check attempt ${attempt}/${max_attempts} failed"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 15
                fi
                ((attempt++))
              done

              log "✗ Container health check failed after ${max_attempts} attempts"
              return 1
            }

            rollback_version() {
              if [ ! -f "${previous_sha_file}" ]; then
                log "✗ No previous version found for rollback"
                return 1
              fi

              previous_sha=$(cat "${previous_sha_file}")
              log "Rolling back to previous version: ${previous_sha}"

              docker pull "${backend_image}:sha-${previous_sha}"
              docker pull "${frontend_image}:sha-${previous_sha}"
              docker tag "${backend_image}:sha-${previous_sha}" "${backend_image}:latest"
              docker tag "${frontend_image}:sha-${previous_sha}" "${frontend_image}:latest"

              cd "${app_directory}"
              docker compose down
              docker compose up -d

              log "Performing health checks on rolled back version..."
              if container_health_check && site_health_check; then
                log "✓ Rollback successful - all health checks passed"
                return 0
              else
                log "✗ Rollback failed - health checks did not pass"
                log "Manual intervention required"
                return 1
              fi
            }

            cleanup_old_images() {
              log "Cleaning up old Docker images..."
              docker images --format "{{.Repository}}:{{.Tag}}" | grep -F "${backend_image}" | grep -v ":latest$" | sort -r | tail -n +4 | xargs -r docker rmi 2>/dev/null || true
              docker images --format "{{.Repository}}:{{.Tag}}" | grep -F "${frontend_image}" | grep -v ":latest$" | sort -r | tail -n +4 | xargs -r docker rmi 2>/dev/null || true
            }

            validate_secrets
            log "Starting deployment for commit ${current_sha}..."

            mkdir -p "${app_directory}"
            cd "${app_directory}"

            log "Authenticating to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            if [ -f "${latest_sha_file}" ]; then
              current_deployed_sha=$(cat "${latest_sha_file}")
              echo "${current_deployed_sha}" > "${previous_sha_file}"
              log "Stored previous version: ${current_deployed_sha}"
            else
              log "No previous deployment found (.latest_sha file missing)"
            fi

            log "Writing docker-compose.yml..."
            cat > docker-compose.yml << 'COMPOSE'
            services:
              backend:
                image: ${{ env.BACKEND_IMAGE }}:latest
                container_name: consensus-backend
                restart: unless-stopped
                env_file: .env
                environment:
                  - PORT=8080
                  - MONGO_URI=mongodb://mongo:27017
                  - ALLOWED_ORIGIN=https://${{ secrets.DOMAIN_NAME }}
                ports:
                  - 127.0.0.1:8080:8080
                depends_on:
                  - mongo
                networks:
                  - consensus

              frontend:
                image: ${{ env.FRONTEND_IMAGE }}:latest
                container_name: consensus-frontend
                restart: unless-stopped
                ports:
                  - 127.0.0.1:3000:3000
                networks:
                  - consensus

              mongo:
                image: mongo:8
                container_name: consensus-mongo
                restart: unless-stopped
                volumes:
                  - consensus-mongo-data:/data/db
                networks:
                  - consensus

            networks:
              consensus:

            volumes:
              consensus-mongo-data:
            COMPOSE

            log "Writing .env file from secrets..."
            cat > .env << 'EOF'
            GMAIL_EMAIL=${{ secrets.GMAIL_EMAIL }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            MODE=production
            EOF

            log "Pulling images for commit ${current_sha}..."
            docker pull "${backend_image}:sha-${current_sha}"
            docker pull "${frontend_image}:sha-${current_sha}"
            docker tag "${backend_image}:sha-${current_sha}" "${backend_image}:latest"
            docker tag "${frontend_image}:sha-${current_sha}" "${frontend_image}:latest"
            log "✓ Images pulled successfully"

            log "Deploying new version..."
            docker compose down
            docker compose up -d

            log "Performing container health check..."
            if ! container_health_check; then
              log "Container health check failed. Attempting rollback..."
              if rollback_version; then
                log "Rollback successful but deployment failed"
                exit 1
              else
                log "Rollback failed. Manual intervention required"
                exit 1
              fi
            fi

            log "Performing site health check..."
            if ! site_health_check; then
              log "Site health check failed. Attempting rollback..."
              if rollback_version; then
                log "Rollback successful but deployment failed"
                exit 1
              else
                log "Rollback failed. Manual intervention required"
                exit 1
              fi
            fi

            echo "${current_sha}" > "${latest_sha_file}"
            log "Updated .latest_sha file with current deployment: ${current_sha}"

            cleanup_old_images
            log "✓ Deployment successful for commit ${current_sha}"
